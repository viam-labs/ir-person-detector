name: ir_data

# Dataset paths
data:
  train_annotations: ir_data/train/cleaned_train_coco.json
  train_images: ir_data/train/images
  val_annotations: ir_data/val/cleaned_val_coco.json
  val_images: ir_data/val/images
  test_annotations: ir_data/test/cleaned_test_coco.json
  test_images: ir_data/test/images
  names: ['person']

# Image configuration
image:
  channels: 1  # greyscale 

# Dataset specific parameters
classes:
  - person

#hardcoded values are overriden by optuna sweeper
transform: #including more augmentations to prevent overfitting, intensity and geometric transformations.
  train:
    - name: Resize
      params:
        size: ${model.transform.input_size}
    - name: RandomRotation
      params: 
        degrees: 10 
        p: 0.3
        expand: false
    - name: RandomHorizontalFlip
      params:
        p: 0.5 
    - name: RandomVerticalFlip
      params:
        p: 0.2 
    - name: Normalize
      params:
        mean: [0.2618] #calculated from norm_values.py from 100 batches
        std: [0.1905]
    - name: ColorJitter
      params:
        brightness: 0.2 
        contrast: 0.2
        p: 0.5
    - name: RandomGaussianNoise
      params:
        mean: 0.0
        std: 0.1
        p: 0.5
    - name: RandomGamma
      params: 
        gamma: 1
        p: 0.5

  val:
    - name: Resize
      params:
        size: ${model.transform.input_size}
    - name: Normalize
      params: 
        mean: [0.2618]
        std: [0.1905]
  test:
    - name: Normalize
      params:
         mean: [0.2618]
         std: [0.1905]

# COCO specific settings
coco:
  format: true
  min_bbox_size: 8
  max_bbox_size: 640
  min_bbox_area: 64
  max_bbox_area: 409600  

  