name: ir_data

# Dataset paths
data:
  train_annotations: ir_data/train/cleaned_train_coco.json
  train_images: ir_data/train/images
  val_annotations: ir_data/val/cleaned_val_coco.json
  val_images: ir_data/val/images
  test_annotations: ir_data/test/cleaned_test_coco.json
  test_images: ir_data/test/images
  names: ['person']

# Image configuration
image:
  channels: 1  # greyscale 

# Dataset specific parameters
classes:
  - person

transform: #including more augmentations to prevent overfitting 
  train:
    - name: Resize
      params:
        size: ${model.transform.input_size}
    - name: RandomRotation
      params: 
        degrees: ${optimization_results.best_params.degrees} #10
        expand: false
    - name: RandomHorizontalFlip
      params:
        p: 0.5 #${optimization_results.best_params.p_h} #0.5
    - name: RandomVerticalFlip
      params:
        p: 0.2 #${optimization_results.best_params.p_v} #0.5
    - name: Normalize
      params:
        mean: [0.485]
        std: [0.229]
  val:
    - name: Resize
      params:
        size: ${model.transform.input_size}
    - name: Normalize
      params:
        mean: [0.485]
        std: [0.229]
  test:
    - name: Normalize
      params:
        mean: [0.485]
        std: [0.229]

# COCO specific settings
coco:
  format: true
  min_bbox_size: 8
  max_bbox_size: 640
  min_bbox_area: 64
  max_bbox_area: 409600  

  