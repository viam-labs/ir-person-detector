hydra:
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    direction: minimize
    study_name: thermal_person_detection
    n_trials: 50
    n_jobs: 1
    params:
      model: choice(custom_detector,effnet,faster_rcnn,ssdlite)
      training.learning_rate: tag(log, interval(1e-6, 1e-3)) #log scale sampling 
      training.weight_decay: tag(log, interval(1e-6, 1e-3))

# hydra: #if not using optuna
#   sweeper:
#     params:
#       model: choice(custom_detector,effnet,faster_rcnn,ssdlite)
#       optimization_results: choice(faster_rcnn,ssdlite)
#       dataset: choice(ir_data,flir)
    
defaults:
  - model: faster_rcnn  
  - dataset: ir_data
  #- optimization_results: faster_rcnn
  - override hydra/sweeper: optuna #need for optuna!
  - _self_

# Experiment settings
experiment:
  name: run_${now:%Y-%m-%d}_${now:%H-%M-%S}
  seed: 42
  device: cuda

# Training configuration once optuna is done 
training:
  batch_size: 32
  num_epochs: 25
  learning_rate: 1e-4 # ${optimization_results.best_params.learning_rate} #1e-3
  weight_decay: 1e-3 # ${optimization_results.best_params.weight_decay} #1e-3
  early_stopping_patience: 15 # ${optimization_results.best_params.early_stopping_patience} #15
  checkpoint_dir: checkpoints
  num_workers: 2
  pin_memory: false
  #drop_prob: 0.3  #${optimization_results.best_params.dropout}
# Logging
logging:
  save_dir: ${hydra:runtime.output_dir}